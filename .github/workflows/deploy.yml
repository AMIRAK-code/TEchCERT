name: Checks

# GitHub is the backup and version-control copy; the site is deployed from a local
# machine with `npm run deploy` (wrangler), never from here. This workflow only checks
# that every push to main lints, passes the database tests and builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:db
      - run: npm run build
